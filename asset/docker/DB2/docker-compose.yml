version: '3.9'

services:
  db2:
    image: ibmcom/db2:11.5.8.0
    container_name: db2
    privileged: true
    ports:
      - "50000:50000"    # JDBC 접속 포트
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: "1234"
      DBNAME: testdb
      AUTOCONFIG: "false"        # 패스워드 만료 및 자동 초기화 방지 정책 적용
    volumes:
      - db2_data:/database

volumes:
  db2_data:
