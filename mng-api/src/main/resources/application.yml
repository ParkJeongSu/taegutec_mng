---
# 'pex,tex,dispatcher,scheduler' 프로필이 활성화될 때만 이 설정이 적용됩니다.
spring:
  config:
    activate:
      on-profile: pex,tex,scheduler,simulator
  rabbitmq:
    #    host: 192.168.50.135 #192.168.50.225 #localhost
    #    port: 5672
    #    username: eosuser # eosuser
    #    password: eosuser
    host: localhost #192.168.50.225 #localhost #192.168.50.135
    port: 5672
    username: eosuser # eosuser , admin
    password: eosuser
    dynamic: true
    listener:
      simple:
        concurrency: 10 # 시작 시 생성되는 소비자(consumer) 스레드 수
        max-concurrency: 10 # 부하 증가 시 최대 확장 가능한 소비자 스레드 수
        prefetch: 1 # 스레드당 딱 1개씩만 사전 인출
        shutdown-timeout: 60s               # 종료 시 60초 대기 (setShutdownTimeout)
        force-stop-for-concurrency: false # 종료 시 리스너가 진행 중인 작업을 마칠 때까지 기다리게 함
        missing-queues-fatal: true # 리슨하려는 큐가 없으면 치명적(Fatal) 에러로 간주하고 앱 종료 시도
        default-requeue-rejected: false # 메시지 처리 중 에러가 났을 때, 다시 큐에 넣지 않음 (중요!)
        retry:
          enabled: false # 재시도 기능을 아예 끔